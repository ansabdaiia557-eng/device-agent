name: Device Agent APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DeviceAgent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceAgent
          path: DeviceAgent.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: device-agent-v${{ github.run_number }}
          name: Device Agent v${{ github.run_number }}
          files: DeviceAgent.apk
          target_commitish: ${{ github.sha }}
